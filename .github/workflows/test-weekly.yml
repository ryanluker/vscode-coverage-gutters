name: Continuous Weekly Integration
on:
  schedule:
    # Weekly on Mondays for Windows / Mac
    # Cron is always UTC, 16:00 UTC is 08:00 PST / 09:00 PDT in America/Vancouver
    - cron: '0 16 * * 1'
  pull_request:
  push:
    branches:
      - master
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - run: npm install
    - run: npm run build
    - run: npm test

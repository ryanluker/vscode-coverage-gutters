name: Continuous Daily Integration
on:
  schedule:
    # Nightly builds for Linux (cheapest)
    # Cron is always UTC, 16:00 UTC is 08:00 PST / 09:00 PDT in America/Vancouver
    - cron: '0 16 * * *'
  pull_request:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - run: npm install
    - run: npm run build
    - run: xvfb-run -a npm test
